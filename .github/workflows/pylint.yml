name: Pylint

on: [push]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10
    - name: Install dependencies
      run: uv sync --locked
    - name: Analysing the code with pylint
      run: uv run pylint $(git ls-files '*.py')

